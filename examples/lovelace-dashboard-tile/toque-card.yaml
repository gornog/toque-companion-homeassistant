- type: custom:button-card
  entity: button.monsieur_cuisine_connect_pause
  name: Pause
  show_name: false
  show_icon: false
  triggers_update:
  - button.monsieur_cuisine_connect_pause
  - sensor.monsieur_cuisine_connect_status
  - sensor.monsieur_cuisine_connect_base_link
  tap_action:
    action: perform-action
    perform_action: button.press
    target:
      entity_id: button.monsieur_cuisine_connect_pause
  hold_action:
    action: more-info
    entity: button.monsieur_cuisine_connect_pause
  style:
    left: 68.0976%
    top: 76.0852%
    width: 6.1797%
    height: 6.7210%
    z-index: 25
  styles:
    card:
    - height: 100%
    - padding: '0'
    - border: '0'
    - background: transparent
    - box-shadow: none
    - cursor: '[[[ return entity?.state === ''unavailable'' ? ''default'' : ''pointer''; ]]]'
    grid:
    - display: block
    - height: 100%
    custom_fields:
      btn:
      - width: 100%
      - height: 100%
  custom_fields:
    btn: '[[[

      const off = entity?.state === ''unavailable'';

      const bg = off ? ''#223048'' : ''#FF8A3D'';

      const bd = off ? ''#2A3A55'' : ''#FF8A3D'';

      const fg = off ? ''#66738A'' : ''#070E1B'';

      const op = off ? ''0.45'' : ''1'';

      return `<svg viewBox="0 0 84 68" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"
      role="img" aria-label="Pause" style="opacity:${op}">

      <rect x="2" y="2" width="80" height="64" rx="18" fill="${bg}" stroke="${bd}" stroke-width="2"/>

      <rect x="33" y="14" width="6" height="20" rx="2" fill="${fg}"/><rect x="45" y="14" width="6" height="20" rx="2" fill="${fg}"/>

      <text x="42" y="56" text-anchor="middle" fill="${fg}" font-size="18" font-weight="700" font-family="sans-serif">Pause</text>

      </svg>`;

      ]]]'
